<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Børneoversigt – Sct. Anna</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --accent:#3a6b5c;
    --accent-light:#eaf2ef;
    --bg:#faf9f7;
    --surface:#ffffff;
    --border:#e4e1db;
    --text:#2b2b28;
    --muted:#8a867d;
    --warn:#c2542f;
    --warn-light:#fbeee7;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg);
    color:var(--text);
  }
  .wrap{max-width:1000px;margin:0 auto;padding:24px 20px 60px;}
  header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  h1{font-size:22px;margin:0;font-weight:800;}
  .sub{color:var(--muted);font-size:13px;margin-top:2px;}
  button{
    font-family:inherit;cursor:pointer;border:none;border-radius:10px;
    padding:10px 16px;font-size:14px;font-weight:700;
  }
  .btn-primary{background:var(--accent);color:white;}
  .btn-primary:hover{opacity:.92;}
  .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);}
  .btn-ghost:hover{background:var(--accent-light);}
  .btn-danger{background:var(--warn-light);color:var(--warn);}

  /* LOGIN */
  #login-screen{
    max-width:380px;margin:80px auto;background:var(--surface);
    border:1px solid var(--border);border-radius:16px;padding:32px;
    text-align:center;
  }
  #login-screen h2{margin-top:0;}
  #login-screen img.logo{width:80px;height:auto;margin-bottom:8px;}
  #login-screen input{
    width:100%;padding:12px 14px;margin:8px 0;border:1px solid var(--border);
    border-radius:10px;font-size:15px;font-family:inherit;
  }
  #login-screen button{width:100%;margin-top:10px;padding:13px;}
  #login-error{color:var(--warn);font-size:13px;margin-top:10px;min-height:16px;}

  /* SEARCH + TABLE */
  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
  #search{
    flex:1;min-width:200px;padding:11px 14px;border:1px solid var(--border);
    border-radius:10px;font-size:14px;font-family:inherit;background:var(--surface);
  }
  table{width:100%;border-collapse:collapse;background:var(--surface);border-radius:14px;overflow:hidden;border:1px solid var(--border);}
  th,td{padding:12px 14px;text-align:left;font-size:14px;border-bottom:1px solid var(--border);}
  th{background:var(--accent-light);color:var(--accent);font-size:11px;text-transform:uppercase;letter-spacing:.4px;font-weight:800;}
  tr:last-child td{border-bottom:none;}
  tr:hover td{background:#fbfaf8;}
  td[contenteditable="true"]{cursor:text;}
  td[contenteditable="true"]:focus{outline:2px solid var(--accent);outline-offset:-2px;background:#fff;}
  .onsker-badge{
    background:var(--warn-light);color:var(--warn);font-size:11px;font-weight:800;
    padding:3px 8px;border-radius:6px;
  }
  .row-actions{display:flex;gap:6px;}
  .row-actions button{padding:6px 10px;font-size:12px;}
  #status{position:fixed;bottom:20px;right:20px;background:var(--accent);color:white;
    padding:10px 18px;border-radius:10px;font-size:13px;font-weight:700;
    opacity:0;transition:opacity .3s;pointer-events:none;}
  #status.show{opacity:1;}
  .empty{color:var(--muted);text-align:center;padding:40px 0;}
</style>
</head>

  <h2>Børneoversigt</h2>
  <p class="sub">Log ind for at fortsætte</p>
  <input type="email" id="email" placeholder="Email" autocomplete="username" />
  <input type="password" id="password" placeholder="Adgangskode" autocomplete="current-password" />
  <button class="btn-primary" onclick="login()">Log ind</button>
  <div id="login-error"></div>
</div>

<!-- APP -->
<div class="wrap" id="app-screen" style="display:none;">
  <header>
    <div>
      <h1>Børneoversigt</h1>
      <div class="sub">Børnehuset Sct. Anna</div>
    </div>
    <div style="display:flex;gap:8px;">
      <button class="btn-ghost" onclick="logout()">Log ud</button>
    </div>
  </header>

  <div class="toolbar">
    <input type="text" id="search" placeholder="Søg efter navn..." oninput="renderTable()" />
    <button class="btn-primary" onclick="addChild()">+ Tilføj barn</button>
  </div>

  <table>
    <thead>
      <tr>
        <th>Navn</th>
        <th>Født</th>
        <th>Indmeldt</th>
        <th>Note</th>
        <th></th>
        <th></th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>
  <div id="empty-msg" class="empty" style="display:none;">Ingen børn fundet.</div>
</div>

<div id="status"></div>

<script>
// ====== SUPABASE SETUP ======
const SUPABASE_URL = "https://zmcxmvewytdedmhbhygi.supabase.co";
const SUPABASE_KEY = "sb_publishable_Ea6NoaJ_rzJGnCo1BPhj6w_6rjRPihv";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let children = [];

// ====== AUTH ======
async function checkSession() {
  const { data } = await sb.auth.getSession();
  if (data.session) {
    showApp();
  } else {
    showLogin();
  }
}

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';

  if (!email || !password) {
    errEl.textContent = 'Udfyld både email og adgangskode.';
    return;
  }

  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) {
    errEl.textContent = 'Forkert email eller adgangskode.';
    return;
  }
  showApp();
}

async function logout() {
  await sb.auth.signOut();
  showLogin();
}

function showLogin() {
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('app-screen').style.display = 'none';
}

function showApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
  loadChildren();
}

// Allow Enter key to submit login
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') login();
});

// ====== DATA ======
async function loadChildren() {
  const { data, error } = await sb
    .from('children')
    .select('*')
    .order('foedt', { ascending: true });

  if (error) {
    showStatus('Fejl ved indlæsning: ' + error.message);
    return;
  }
  children = data || [];
  renderTable();
}

function renderTable() {
  const tbody = document.getElementById('table-body');
  const searchVal = document.getElementById('search').value.toLowerCase();
  tbody.innerHTML = '';

  const filtered = children.filter(c => c.navn.toLowerCase().includes(searchVal));

  document.getElementById('empty-msg').style.display = filtered.length ? 'none' : 'block';

  filtered.forEach(c => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td contenteditable="true" onblur="updateField(${c.id}, 'navn', this.textContent)">${escapeHtml(c.navn)}</td>
      <td>
        <input type="date" value="${c.foedt || ''}" onchange="updateField(${c.id}, 'foedt', this.value)" style="border:none;background:transparent;font-family:inherit;font-size:14px;">
      </td>
      <td>
        <input type="date" value="${c.ind || ''}" onchange="updateField(${c.id}, 'ind', this.value)" style="border:none;background:transparent;font-family:inherit;font-size:14px;">
      </td>
      <td contenteditable="true" onblur="updateField(${c.id}, 'note', this.textContent)">${escapeHtml(c.note || '')}</td>
      <td>${c.onsker ? '<span class="onsker-badge">Ønske</span>' : ''}</td>
      <td class="row-actions">
        <button class="btn-danger" onclick="deleteChild(${c.id})">Slet</button>
      </td>
    `;
    tbody.appendChild(tr);
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

async function updateField(id, field, value) {
  const child = children.find(c => c.id === id);
  if (!child) return;
  if (child[field] === value) return; // no change

  const updateObj = {};
  updateObj[field] = value === '' && (field === 'foedt' || field === 'ind') ? null : value;

  const { error } = await sb.from('children').update(updateObj).eq('id', id);
  if (error) {
    showStatus('Fejl ved gemning: ' + error.message);
    return;
  }
  child[field] = updateObj[field];
  showStatus('Gemt ✓');
}

async function addChild() {
  const { data, error } = await sb
    .from('children')
    .insert({ navn: 'Nyt barn', foedt: null, ind: null, note: '', onsker: false })
    .select()
    .single();

  if (error) {
    showStatus('Fejl ved oprettelse: ' + error.message);
    return;
  }
  children.push(data);
  renderTable();
  showStatus('Barn tilføjet ✓');
}

async function deleteChild(id) {
  if (!confirm('Er du sikker på du vil slette dette barn?')) return;

  const { error } = await sb.from('children').delete().eq('id', id);
  if (error) {
    showStatus('Fejl ved sletning: ' + error.message);
    return;
  }
  children = children.filter(c => c.id !== id);
  renderTable();
  showStatus('Slettet ✓');
}

function showStatus(msg) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}

checkSession();
